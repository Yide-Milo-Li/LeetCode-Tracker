  <!-- Code bracket right: > -->
  <path d="M 337 160 L 417 256 L 337 352" fill="none" stroke="url(#bracketGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center lightning / spark icon -->
  <polygon points="275,130 205,260 255,260 235,382 315,245 265,245" fill="url(#accentGrad)" stroke="#d97706" stroke-width="4" stroke-linejoin="round" />
</svg>
