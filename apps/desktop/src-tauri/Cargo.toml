[package]
name = "leetcode-tracker-desktop"
version = "1.5.0"
description = "LeetCode Tracker Desktop Application"
authors = ["LeetCode Tracker Team"]
edition = "2021"

[lib]
name = "leetcode_tracker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-wdio = { version = "=1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tempfile = "3"
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
tauri-plugin-updater = { version = "~2.12.0", default-features = false, features = ["rustls-tls"] }

# Dedicated native test builds only; distribution never enables this feature.
[features]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

# Runtime Dock icon updates and the persisted bundle icon (palette-tinted app icon).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSData", "NSDictionary", "NSDistributedNotificationCenter", "NSNotification", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSWorkspace"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi"
] }
# COM shell links for the persisted Start menu / taskbar shortcut icon.
windows = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell"
] }
