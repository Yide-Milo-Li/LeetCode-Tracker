name: Retain latest desktop downloads

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retain-downloads.yml'
      - 'scripts/retire-release-downloads.mjs'

permissions: {}

concurrency:
  group: stable-release-downloads
  cancel-in-progress: false

jobs:
  retain:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify latest installers and updater assets before removing older attachments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/retire-release-downloads.mjs --apply
