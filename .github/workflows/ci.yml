name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Run automated test suite
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Validate documentation links
        run: npm run docs:check

      - name: Check formatting and whitespace
        run: git diff --check

  desktop-windows:
    name: Windows desktop boundaries and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Prepare official private runtime
        run: npm run desktop:prepare-runtime
      - name: Verify isolated bundle with private Node
        shell: pwsh
        run: |
          $env:DESKTOP_TEST_NODE = (Resolve-Path apps/desktop/src-tauri/binaries/node-x86_64-pc-windows-msvc.exe).Path
          npm run test:desktop
          exit $LASTEXITCODE
      - name: Set up Rust and checking components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # Cargo embeds frontend assets; prepare them before native checks.
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: Test process ownership and native boundaries
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Lint native host
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build unsigned Windows installer
        run: npm run desktop:build
      - name: Record Windows build identity and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local/evidence/phase21 | Out-Null
          git rev-parse HEAD | Set-Content .local/evidence/phase21/windows-commit.txt
          (Get-FileHash (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName -Algorithm SHA256).Hash | Set-Content .local/evidence/phase21/SHA256SUMS-windows.txt
      # This artifact is for CI review; this workflow never publishes a Release.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-unsigned
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            .local/evidence/phase21/windows-commit.txt
            .local/evidence/phase21/SHA256SUMS-windows.txt
          if-no-files-found: error

  desktop-macos:
    name: macOS Apple Silicon desktop package and migration checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'
      - name: Record native toolchain
        run: |
          mkdir -p .local/evidence/phase21
          {
            uname -a
            node --version
            npm --version
            rustc --version
            cargo --version
            xcodebuild -version
          } | tee .local/evidence/phase21/macos-toolchain.txt
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Set up Rust checking components
        run: rustup component add rustfmt clippy
      - name: Typecheck and run migration tests
        run: |
          npm run check
          node --test tests/migration-bundle.test.ts tests/desktop-runtime.test.ts
      - name: Build frontend and bundled sidecar
        run: |
          npm run build
          npm run desktop:bundle-server
      - name: Prepare verified Apple Silicon runtime
        run: npm run desktop:prepare-runtime -- --target aarch64-apple-darwin
      - name: Check native host
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
          cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build unsigned internal app and DMG
        run: npm run desktop:build:mac -- --ci
      - name: Generate synthetic migration fixture and checksums
        run: |
          node --import tsx scripts/verify-migration-transfer.ts export .local/evidence/phase21/windows-migration.json
          node --import tsx scripts/verify-migration-transfer.ts restore .local/evidence/phase21/windows-migration.json .local/evidence/phase21/macos-restored.json
          mkdir -p .local/evidence/phase21
          git rev-parse HEAD > .local/evidence/phase21/macos-commit.txt
          npm ls --depth=0 --json > .local/evidence/phase21/npm-dependencies.json
          shasum -a 256 apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg > .local/evidence/phase21/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-desktop-internal
          path: |
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            .local/evidence/phase21/windows-migration.json
            .local/evidence/phase21/macos-restored.json
            .local/evidence/phase21/SHA256SUMS-macos.txt
            .local/evidence/phase21/macos-commit.txt
            .local/evidence/phase21/macos-toolchain.txt
            .local/evidence/phase21/npm-dependencies.json
          if-no-files-found: error

  desktop-macos-native:
    name: macOS embedded WebView native migration test
    runs-on: macos-14
    needs: desktop-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'
      - name: Install application dependencies
        run: npm ci
      - name: Install isolated WebdriverIO runner
        working-directory: tests/desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p ../../.local/evidence/phase21
          npm ls --depth=0 --json > ../../.local/evidence/phase21/wdio-dependencies.json
      - name: Build dedicated frontend and synthetic fixture
        run: |
          npm run build:desktop:e2e
          npm run desktop:bundle-server
          npm run desktop:prepare-runtime -- --target aarch64-apple-darwin
          node --import tsx scripts/verify-migration-transfer.ts export .local/evidence/phase21/windows-migration.json
      - name: Build test-only Tauri app with embedded driver permissions
        run: npm --prefix apps/desktop run tauri -- build --target aarch64-apple-darwin --features desktop-e2e --config src-tauri/tauri.macos.conf.json --config src-tauri/tauri.e2e.conf.json --ci
      - name: Verify test application bundle exists
        run: |
          ls -la "apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/"
          chmod +x "apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LeetCode Tracker.app/Contents/MacOS/leetcode-tracker-desktop"
      - name: Run real WKWebView migration flow
        working-directory: tests/desktop
        env:
          TAURI_APP_PATH: ${{ github.workspace }}/apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LeetCode Tracker.app/Contents/MacOS/leetcode-tracker-desktop
        run: npx wdio run wdio.conf.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: macos-native-e2e-evidence
          path: |
            .local/evidence/phase21/macos-settings.png
            .local/evidence/phase21/wdio-dependencies.json
          if-no-files-found: error
