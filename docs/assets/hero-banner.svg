      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#90a4ae">ANNUAL ACTIVITY HEATMAP</text>
      <!-- 15 columns x 5 rows of activity blocks -->
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="20" height="20" rx="3.5" fill="#1e2e22"/><rect x="0" y="24" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="0" y="48" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="0" y="72" width="20" height="20" rx="3.5" fill="#1b5e20"/><rect x="0" y="96" width="20" height="20" rx="3.5" fill="#81c784"/>
        <rect x="25" y="0" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="25" y="24" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="25" y="48" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="25" y="72" width="20" height="20" rx="3.5" fill="#a5d6a7"/><rect x="25" y="96" width="20" height="20" rx="3.5" fill="#2e7d32"/>
        <rect x="50" y="0" width="20" height="20" rx="3.5" fill="#1b5e20"/><rect x="50" y="24" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="50" y="48" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="50" y="72" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="50" y="96" width="20" height="20" rx="3.5" fill="#4caf50"/>
        <rect x="75" y="0" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="75" y="24" width="20" height="20" rx="3.5" fill="#1e2e22"/><rect x="75" y="48" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="75" y="72" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="75" y="96" width="20" height="20" rx="3.5" fill="#2e7d32"/>
        <rect x="100" y="0" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="100" y="24" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="100" y="48" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="100" y="72" width="20" height="20" rx="3.5" fill="#1e2e22"/><rect x="100" y="96" width="20" height="20" rx="3.5" fill="#a5d6a7"/>
        <rect x="125" y="0" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="125" y="24" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="125" y="48" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="125" y="72" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="125" y="96" width="20" height="20" rx="3.5" fill="#2e7d32"/>
        <rect x="150" y="0" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="150" y="24" width="20" height="20" rx="3.5" fill="#a5d6a7"/><rect x="150" y="48" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="150" y="72" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="150" y="96" width="20" height="20" rx="3.5" fill="#4caf50"/>
        <rect x="175" y="0" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="175" y="24" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="175" y="48" width="20" height="20" rx="3.5" fill="#1e2e22"/><rect x="175" y="72" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="175" y="96" width="20" height="20" rx="3.5" fill="#a5d6a7"/>
        <rect x="200" y="0" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="200" y="24" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="200" y="48" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="200" y="72" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="200" y="96" width="20" height="20" rx="3.5" fill="#2e7d32"/>
        <rect x="225" y="0" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="225" y="24" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="225" y="48" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="225" y="72" width="20" height="20" rx="3.5" fill="#a5d6a7"/><rect x="225" y="96" width="20" height="20" rx="3.5" fill="#1e2e22"/>
        <rect x="250" y="0" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="250" y="24" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="250" y="48" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="250" y="72" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="250" y="96" width="20" height="20" rx="3.5" fill="#4caf50"/>
        <rect x="275" y="0" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="275" y="24" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="275" y="48" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="275" y="72" width="20" height="20" rx="3.5" fill="#1e2e22"/><rect x="275" y="96" width="20" height="20" rx="3.5" fill="#81c784"/>
        <rect x="300" y="0" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="300" y="24" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="300" y="48" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="300" y="72" width="20" height="20" rx="3.5" fill="#a5d6a7"/><rect x="300" y="96" width="20" height="20" rx="3.5" fill="#2e7d32"/>
        <rect x="325" y="0" width="20" height="20" rx="3.5" fill="#a5d6a7"/><rect x="325" y="24" width="20" height="20" rx="3.5" fill="#4caf50"/><rect x="325" y="48" width="20" height="20" rx="3.5" fill="#81c784"/><rect x="325" y="72" width="20" height="20" rx="3.5" fill="#2e7d32"/><rect x="325" y="96" width="20" height="20" rx="3.5" fill="#4caf50"/>
        <rect x="350" y="0" width="18" height="20" rx="3.5" fill="#4caf50"/><rect x="350" y="24" width="18" height="20" rx="3.5" fill="#2e7d32"/><rect x="350" y="48" width="18" height="20" rx="3.5" fill="#81c784"/><rect x="350" y="72" width="18" height="20" rx="3.5" fill="#1b5e20"/><rect x="350" y="96" width="18" height="20" rx="3.5" fill="#a5d6a7"/>
      </g>
    </g>

    <!-- Bottom Status Row -->
    <g transform="translate(18, 282)">
      <rect width="368" height="26" rx="5" fill="#152018" stroke="#253529" stroke-width="0.8"/>
      <circle cx="14" cy="13" r="3.5" fill="#81c784"/>
      <text x="26" y="17" font-family="monospace" font-size="10.5" fill="#a5d6a7">Local Fastify + SQLite • Schema v10</text>
    </g>
